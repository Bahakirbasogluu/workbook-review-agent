[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workbookreview"
version = "0.1.0"
description = "An agent that pre-fills a review workbook from evidence documents, batch by batch, with a person confirming every answer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha Kırbaşoğlu" }]
dependencies = ["openpyxl>=3.1", "pydantic>=2.6"]

[project.optional-dependencies]
azure = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
workbookreview = "workbookreview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workbookreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
